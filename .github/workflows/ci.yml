name: CI

on:
  # Rien pour un changement de documentation seule (économise le quota en dépôt privé).
  push:
    paths-ignore: ['docs/**', '**.md']
  pull_request:
    paths-ignore: ['docs/**', '**.md']
  # Bouton « Run workflow » de l'onglet Actions : un plug-in à la demande.
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]

    steps:
      - uses: actions/checkout@v4

      # macOS : paquet universel (Apple Silicon + Intel), pour tous les Mac des clients.
      - name: Configure
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then extra='-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64'; else extra=''; fi
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release $extra

      - name: Build (plug-in, outils, tests ; le validateur VST3 tourne après le plug-in)
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      # Le plug-in prêt à installer (Windows et macOS), téléchargeable depuis
      # la page de l'exécution : dossier OMNIS.vst3 à copier dans le dossier VST3.
      - name: Plug-in à télécharger
        if: runner.os != 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: OMNIS-${{ runner.os }}-VST3
          path: |
            build/VST3/Release/
            LICENSE_NOTICES.md
          retention-days: 30

      # L'installateur Windows (Inno Setup, présent sur les machines Windows de GitHub ;
      # installé sinon) : OMNIS.vst3 dans le dossier VST3 commun + l'outil de mesure.
      - name: Installateur Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          $v = (Select-String -Path source/plugin/vst3/OmnisVersion.h -Pattern 'OMNIS_VERSION_(MAJOR|MINOR|PATCH) (\d+)' | ForEach-Object { $_.Matches[0].Groups[2].Value }) -join '.'
          & $iscc "/DAppVersion=$v" "/DSrcDir=..\build" installer\OMNIS.iss
      - name: Installateur à télécharger
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: OMNIS-Windows-installateur
          path: installer/Output/*.exe
          retention-days: 30

      # L'outil qui mesure les références sur le PC de l'utilisateur
      # (docs/REFERENCES.md) : omnis_refdb scan dossier/ --db references.txt
      - name: Outil de mesure des références
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: OMNIS-Windows-outils
          path: |
            build/bin/**/omnis_refdb.exe
            LICENSE_NOTICES.md
          retention-days: 30

  # Le paquet pour l'installateur ONIRIQUE : Windows + macOS + outil + mentions +
  # notice d'intégration (installer/INTEGRATION_ONIRIQUE.md) + empreintes.
  package:
    name: Paquet pour l'installateur ONIRIQUE
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: OMNIS-Windows-VST3, path: art/win }
      - uses: actions/download-artifact@v4
        with: { name: OMNIS-macOS-VST3, path: art/mac }
      - uses: actions/download-artifact@v4
        with: { name: OMNIS-Windows-outils, path: art/tools }
      - name: Assembler
        run: |
          set -e
          out=OMNIS-pour-ONIRIQUE
          mkdir -p $out/Windows $out/macOS $out/outils
          cp -R "$(find art/win -type d -name OMNIS.vst3 -prune | head -1)" $out/Windows/
          cp -R "$(find art/mac -type d -name OMNIS.vst3 -prune | head -1)" $out/macOS/
          cp "$(find art/tools -name omnis_refdb.exe | head -1)" $out/outils/
          cp LICENSE_NOTICES.md docs/REFERENCES.md installer/INTEGRATION_ONIRIQUE.md $out/
          v=$(grep -E 'OMNIS_VERSION_(MAJOR|MINOR|PATCH) ' source/plugin/vst3/OmnisVersion.h | awk '{print $3}' | paste -sd.)
          { echo "OMNIS $v — Abrasion Labs — https://onirique.store"
            echo "Commit : $GITHUB_SHA"
            echo "Empreintes SHA-256 :"
            (cd $out && find . -type f ! -name MANIFEST.txt | sort | xargs sha256sum); } > $out/MANIFEST.txt
          cat $out/MANIFEST.txt | head -5
      - uses: actions/upload-artifact@v4
        with:
          name: OMNIS-pour-ONIRIQUE
          path: OMNIS-pour-ONIRIQUE/
          retention-days: 90

  sanitizers:
    name: ASan + UBSan / TSan (moteur seul)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: ASan + UBSan
        run: |
          cmake -S . -B build-asan -DOMNIS_BUILD_VST3=OFF -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all"
          cmake --build build-asan --parallel
          ctest --test-dir build-asan --output-on-failure

      - name: TSan (primitives lock-free)
        run: |
          cmake -S . -B build-tsan -DOMNIS_BUILD_VST3=OFF -DOMNIS_BUILD_TOOLS=OFF -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_CXX_FLAGS="-fsanitize=thread"
          cmake --build build-tsan --parallel
          ./build-tsan/omnis_tests spsc
          ./build-tsan/omnis_tests triple
          ./build-tsan/omnis_tests lien
